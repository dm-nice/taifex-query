name: Daily Morning Data Collection (21:00 TWN)

on:
  schedule:
    # 台灣時間 21:00 = UTC 13:00
    - cron: '0 13 * * *'
  workflow_dispatch:  # 允許手動觸發

jobs:
  collect-morning-data:
    runs-on: ubuntu-latest
    # 只在週一到週五執行（避免週末）
    if: github.event_name == 'workflow_dispatch' || (github.event.schedule && contains(fromJSON('["1","2","3","4","5"]'), format('{0}', github.event.schedule.day_of_week)))

    steps:
      - name: Check if trading day
        id: check_day
        run: |
          # 取得台北時間的星期幾 (0=週日, 6=週六)
          DAY_OF_WEEK=$(TZ='Asia/Taipei' date +%u)
          echo "DAY_OF_WEEK=$DAY_OF_WEEK"
          # 1-5 是週一到週五
          if [ "$DAY_OF_WEEK" -ge 1 ] && [ "$DAY_OF_WEEK" -le 5 ]; then
            echo "is_trading_day=true" >> $GITHUB_OUTPUT
          else
            echo "is_trading_day=false" >> $GITHUB_OUTPUT
            echo "⏭️  Weekend detected, skipping data collection"
          fi

      - name: Checkout repository
        if: steps.check_day.outputs.is_trading_day == 'true'
        uses: actions/checkout@v4

      - name: Set up Python
        if: steps.check_day.outputs.is_trading_day == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chrome and ChromeDriver
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip
          wget -q -O - https://dl-ssl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
          sudo sh -c 'echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" >> /etc/apt/sources.list.d/google-chrome.list'
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable

      - name: Get current date (Asia/Taipei)
        if: steps.check_day.outputs.is_trading_day == 'true'
        id: date
        run: |
          echo "TODAY=$(TZ='Asia/Taipei' date +'%Y-%m-%d')" >> $GITHUB_OUTPUT

      - name: Debug - Check environment
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          echo "Current directory:"
          pwd
          echo "List files:"
          ls -la
          echo "Check modules directory:"
          ls -la modules/ | head -10 || echo "modules/ not found"
          echo "Check run.py:"
          ls -la run.py || echo "run.py not found"

      - name: Run data collection - Morning factors (F01-F07, F11-F17)
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          echo "Collecting morning data for ${{ steps.date.outputs.TODAY }}"
          python run.py ${{ steps.date.outputs.TODAY }} --session morning || echo "run.py failed with exit code $?"
        continue-on-error: true

      - name: Generate prediction dashboard
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          echo "Generating prediction dashboard..."
          python predict_dashboard.py
        continue-on-error: true

      - name: Commit and push changes
        if: steps.check_day.outputs.is_trading_day == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git add README.md || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "🌅 Morning data update: ${{ steps.date.outputs.TODAY }}" && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload data artifacts (optional)
        if: steps.check_day.outputs.is_trading_day == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: morning-data-${{ steps.date.outputs.TODAY }}
          path: data/
          retention-days: 7
