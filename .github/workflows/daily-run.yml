name: Daily Taifex Data Fetch

on:
  schedule:
    # 每天 21:00 台北時間 (UTC+8) = 13:00 UTC
    - cron: '0 13 * * *'
  
  # 允許手動觸發
  workflow_dispatch:
    inputs:
      date:
        description: '查詢日期 (YYYY-MM-DD，留空則使用今天)'
        required: false
        type: string
      mode:
        description: '執行模式'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - dev

jobs:
  run-taifex:
    runs-on: ubuntu-latest
    
    # 設定時區為台北時間
    env:
      TZ: Asia/Taipei
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pydantic pydantic-settings lxml
      
      - name: 🚀 Run Taifex data fetch
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(date +%Y-%m-%d)
          fi
          
          if [ "${{ github.event.inputs.mode }}" = "dev" ]; then
            python run.py "$DATE" dev
          else
            python run.py "$DATE"
          fi
      
      - name: 📤 Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taifex-data-${{ github.run_number }}
          path: |
            data/*.txt
            data/*.log
          retention-days: 30
      
      - name: 💾 Commit and push results (optional)
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Taifex data $(date +%Y-%m-%d)" && git push)
        continue-on-error: true
