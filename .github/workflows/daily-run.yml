name: Daily Taifex Data Fetch

on:
  schedule:
    # 每天 21:00 台北時間 (UTC+8) = 13:00 UTC
    - cron: '0 13 * * *'
  
  # 允許手動觸發
  workflow_dispatch:
    inputs:
      date:
        description: '查詢日期 (YYYY-MM-DD，留空則使用今天)'
        required: false
        type: string
      mode:
        description: '執行模式'
        required: false
        default: 'production'
        type: choice
        options:
          - production
          - dev

jobs:
  run-taifex:
    runs-on: ubuntu-latest
    
    # 設定時區為台北時間
    env:
      TZ: Asia/Taipei
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas pydantic pydantic-settings lxml
      
      - name: 🚀 Run Taifex data fetch
        run: |
          if [ -n "${{ github.event.inputs.date }}" ]; then
            DATE="${{ github.event.inputs.date }}"
          else
            DATE=$(date +%Y-%m-%d)
          fi
          
          if [ "${{ github.event.inputs.mode }}" = "dev" ]; then
            python run.py "$DATE" dev
          else
            python run.py "$DATE"
          fi
          
          # 更新檔案時間戳記為台北時間
          echo "📅 更新檔案時間戳記為台北時間..."
          echo "當前時間 (台北): $(date '+%Y-%m-%d %H:%M:%S')"
          
          # 顯示更新前的檔案時間
          echo "更新前的檔案時間:"
          ls -l data/*.txt data/*.log 2>/dev/null || true
          
          # 更新檔案時間戳記
          find data -type f \( -name "*.txt" -o -name "*.log" \) -exec touch -m {} \;
          
          # 顯示更新後的檔案時間
          echo "更新後的檔案時間:"
          ls -l data/*.txt data/*.log 2>/dev/null || true
          echo "✅ 檔案時間戳記已更新"

      - name: 📦 Pack results (tar.gz keeps epoch timestamps)
        run: |
          echo "建立 tar.gz 封裝 (保留 mtime，下載後依本機時區顯示)..."
          tar -czf taifex-data-${{ github.run_number }}.tar.gz data/
          ls -l taifex-data-${{ github.run_number }}.tar.gz
      
      - name: 📤 Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: taifex-data-${{ github.run_number }}
          path: taifex-data-${{ github.run_number }}.tar.gz
          retention-days: 30
      
      - name: 💾 Commit and push results (optional)
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add data/
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-update: Taifex data $(date +%Y-%m-%d)" && git push)
        continue-on-error: true
