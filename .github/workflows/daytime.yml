name: Daily Daytime Scraper

# 觸發條件：每天工作日晚上 21:00 台灣時間執行
on:
  schedule:
    # 晚上 21:00 台灣時間 (UTC+8) = 13:00 UTC
    # 格式: 分鐘 小時 日期 月份 星期
    # 星期: 0=日, 1=一, 2=二, ..., 5=五, 6=六
    - cron: '0 13 * * 1-5'
  # 允許手動觸發
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    name: 日盤數據爬蟲

    steps:
      # 1. 檢出代碼
      - name: 檢出代碼
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 2. 設置 Python 環境
      - name: 設置 Python 3.9
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          cache: 'pip'

      # 3. 安裝依賴
      - name: 安裝依賴
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt
          pip list | grep -E "pytz|playwright|requests"

      # 4. 安裝 Playwright 瀏覽器
      - name: 安裝 Playwright 瀏覽器
        run: |
          playwright install chromium

      # 5. 執行日盤爬蟲
      - name: 執行日盤爬蟲
        run: |
          python daytime_query.py

      # 6. 檢查是否有新文件生成
      - name: 檢查生成的文件
        run: |
          ls -la output/

      # 7. 配置 Git 用戶信息
      - name: 配置 Git
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

      # 8. 提交結果到 GitHub
      - name: 提交到 GitHub
        run: |
          if [[ -n $(git status -s output/) ]]; then
            git add output/ --force
            git commit -m "自動爬蟲: 日盤數據 $(date +'%Y-%m-%d %H:%M')'

              執行時間: $(date)
              工作流: Daily Daytime Scraper

              Co-Authored-By: GitHub Actions <actions@github.com>"
            git push
          else
            echo "沒有新的數據變更"
          fi

      # 9. 顯示執行結果
      - name: 顯示執行結果
        if: always()
        run: |
          echo "=== 執行完成 ==="
          echo "時間: $(date)"
          echo "文件列表:"
          ls -lh output/ | tail -5
