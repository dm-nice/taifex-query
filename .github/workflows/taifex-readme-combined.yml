name: Taifex Daily Update with README and Visualization

on:
  # 僅允許手動觸發，停用自動排程
  workflow_dispatch:       # 手動觸發

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: |
        pip install pandas matplotlib

    - name: Generate visualization and README
      run: |
        python - <<'EOF'
        import os, glob
        import pandas as pd
        import matplotlib.pyplot as plt
        from datetime import datetime

        # === 1. 產生目錄結構 ===
        def tree(dir_path, prefix=""):
            entries = sorted(os.listdir(dir_path))
            lines = []
            for i, entry in enumerate(entries):
                path = os.path.join(dir_path, entry)
                connector = "├── " if i < len(entries)-1 else "└── "
                lines.append(prefix + connector + entry)
                if os.path.isdir(path) and not entry.startswith(".git"):
                    extension = "│   " if i < len(entries)-1 else "    "
                    lines.extend(tree(path, prefix + extension))
            return lines

        structure = "\n".join(tree("."))

        # === 2. 找最新 CSV 並產生折線圖 ===
        files = glob.glob("data/*trading.csv")
        latest_date = "尚無資料"
        if files:
            latest = max(files, key=os.path.getctime)
            df = pd.read_csv(latest)
            latest_date = df["日期"].iloc[-1]

            plt.figure(figsize=(10,5))
            plt.plot(df["日期"], df["外資淨額"], marker="o", label="外資淨額")
            plt.title("外資淨額趨勢")
            plt.xlabel("日期")
            plt.ylabel("淨額")
            plt.legend()
            plt.grid(True)
            os.makedirs("visualize", exist_ok=True)
            plt.savefig("visualize/foreign_net_trend.png")

        # === 3. 更新 README ===
        with open("README.md", "w", encoding="utf-8") as f:
            f.write("# TAIFEX 自動化查詢專案（每日更新）\n\n")
            f.write(f"📅 最新更新日期：{latest_date}\n\n")
            f.write("## 📂 專案目錄結構\n\n")
            f.write("```\n" + structure + "\n```\n\n")
            f.write("## 📊 外資淨額趨勢圖\n\n")
            f.write("![外資淨額趨勢](visualize/foreign_net_trend.png)\n\n")
            f.write("本專案每天早上 06:00 自動抓取前一交易日資料，並更新目錄結構與折線圖。")
        EOF

    - name: Commit and push results
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add README.md visualize/*.png data/*.csv
        git commit -m "docs: 自動更新 README 目錄結構與折線圖"
        git push